<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dharma's Echo</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+Devanagari:wght@300;400;500&family=Jomolhari&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --cream: #f8f0d8;
  --cream-border: #d8c080;
  --gold: #c8a030;
  --gold-dark: #a08030;
  --amber: #b06818;
  --text: #2a2010;
  --text-mid: #4a3a18;
  --text-label: #6a5820;
  --text-faint: #c8a855;
}

body {
  background: #ffffff;
  font-family: 'Lora', Georgia, serif;
  color: var(--text);
  max-width: 680px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 5rem;
}

/* ── Header ── */
.header {
  padding: 2.4rem 3rem 1.8rem;
  border-bottom: 1px solid var(--cream-border);
}
.header-name {
  font-family: sans-serif;
  font-size: 0.95rem;
  letter-spacing: 0.42em;
  font-weight: 300;
  color: var(--text);
}
.header-sub {
  font-family: sans-serif;
  font-size: 0.56rem;
  letter-spacing: 0.25em;
  text-transform: none;
  color: var(--gold);
  margin-top: 0.5rem;
}

/* ── Key gate ── */
.key-gate {
  padding: 0.9rem 3rem;
  border-bottom: 1px solid var(--cream-border);
  background: var(--cream);
  display: flex;
  align-items: center;
  gap: 0.8rem;
}
.key-gate.hidden { display: none; }
.key-label {
  font-family: sans-serif;
  font-size: 0.56rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold-dark);
  white-space: nowrap;
  font-weight: 600;
}
.key-input {
  flex: 1;
  border: none;
  border-bottom: 1px solid var(--cream-border);
  padding: 0.35rem 0.5rem;
  font-family: monospace;
  font-size: 0.82rem;
  color: var(--text);
  outline: none;
  background: transparent;
  min-width: 0;
}
.key-save {
  background: none;
  border: none;
  font-family: sans-serif;
  font-size: 0.56rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  cursor: pointer;
  padding: 0.3rem 0;
}
.key-save:hover { color: var(--text); }

/* ── Write area ── */
.write-area { padding: 3rem 3rem 0; }
textarea {
  width: 100%;
  min-height: 80px;
  border: none;
  outline: none;
  resize: none;
  font-family: 'Lora', Georgia, serif;
  font-size: 1.05rem;
  line-height: 1.9;
  color: var(--text);
  background: transparent;
  display: block;
}
textarea::placeholder { color: var(--text-faint); font-style: italic; font-size: 1.05rem; }
.write-hint {
  font-family: sans-serif;
  font-size: 0.8rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-top: 0.5rem;
  transition: opacity 0.3s;
}
.write-hint.hidden { opacity: 0; }

.echo-row {
  display: flex;
  justify-content: flex-end;
  padding: 1rem 3rem 2.5rem;
}
.echo-btn {
  background: none;
  border: none;
  font-family: sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
  cursor: pointer;
  padding: 0.3rem 0;
  transition: color 0.2s;
}
.echo-btn:hover { color: var(--text); }
.echo-btn:disabled { color: var(--text-faint); cursor: not-allowed; }

/* ── Loading ── */
.loading { display: none; padding: 2.5rem 3rem; }
.loading.visible { display: block; }
.loading-text {
  font-family: sans-serif;
  font-size: 0.56rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

/* ── Response ── */
.response { display: none; animation: fadeIn 0.7s ease; }
.response.visible { display: block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

/* You wrote */
.you-wrote {
  padding: 1.4rem 3rem 1.3rem;
  border-bottom: 1px solid var(--amber);
  margin-bottom: 1.6rem;
}
.you-wrote-label {
  font-family: sans-serif;
  font-size: 0.56rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 0.6rem;
}
.you-wrote-text {
  font-size: 1.05rem;
  font-style: italic;
  color: var(--gold);
  line-height: 1.9;
}

/* Response body */
.response-body { padding: 0 3rem; }

/* Opening */
.opening {
  font-size: 0.97rem;
  line-height: 1.9;
  color: var(--text);
  margin-bottom: 2.4rem;
}

/* Term block */
.term-block {
  background: var(--cream);
  border: 1px solid var(--cream-border);
  border-left: 3px solid var(--gold);
  padding: 1.8rem 2rem;
  margin-bottom: 2.4rem;
}
.term-scripts {
  display: flex;
  gap: 2.5rem;
  align-items: flex-start;
  margin-bottom: 1.2rem;
  flex-wrap: wrap;
}
.term-col { display: flex; flex-direction: column; }
.term-script {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.56rem;
  font-weight: 300;
  color: #a82010;
  letter-spacing: 0.02em;
  line-height: 1.3;
}
.term-script-tibetan {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.36rem;
  font-weight: 300;
  color: #a82010;
  line-height: 1.4;
}
.term-script-roman {
  font-family: 'Lora', Georgia, serif;
  font-size: 0.92rem;
  font-style: italic;
  color: #a82010;
  letter-spacing: 0.02em;
  margin-top: 0.25rem;
}
.term-inline { color: #a82010; }
.term-first {
  font-size: 0.97rem;
  line-height: 1.85;
  color: var(--text);
  font-weight: 600;
  margin-bottom: 0.5rem;
}
.term-body {
  font-size: 0.97rem;
  line-height: 1.9;
  color: var(--text-mid);
}

/* Section divider — amber line */
.section-rule {
  border: none;
  border-top: 1px solid var(--amber);
  margin: 0 0 2.4rem;
  opacity: 0.5;
}

/* Figure + Source */
.figure-source { margin-bottom: 2.4rem; }

.figure-name {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.25rem;
}
.figure-tradition {
  font-family: sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.16em;
  text-transform: none;
  color: var(--gold-dark);
  margin-bottom: 0.7rem;
}
.figure-key-work {
  font-family: sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.12em;
  text-transform: none;
  color: var(--gold-dark);
  margin-bottom: 0.6rem;
}
.figure-key-work em {
  font-style: italic;
  text-transform: none;
  letter-spacing: 0;
  font-size: 0.75rem;
}
.figure-desc {
  font-size: 0.97rem;
  line-height: 1.9;
  color: var(--text-mid);
  margin-bottom: 1.6rem;
}
.source-title {
  font-family: sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.14em;
  color: #a82010;
  margin-bottom: 0.9rem;
  padding-bottom: 0.7rem;
  border-bottom: 1px solid var(--cream-border);
}
.source-title em {
  font-style: italic;
  font-family: 'Lora', Georgia, serif;
  letter-spacing: 0.02em;
  font-size: 0.78rem;
}
.source-title .source-ref-upper {
  letter-spacing: 0.18em;
  text-transform: none;
  font-size: 0.62rem;
}
.source-box {
  background: var(--cream);
  border: 1px solid var(--cream-border);
  border-left: 3px solid var(--amber);
  padding: 1.2rem 1.6rem;
}
.source-passage {
  font-size: 0.97rem;
  font-style: normal;
  color: var(--text);
  line-height: 1.9;
  margin-bottom: 0.55rem;
}
.source-translator {
  font-family: sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.14em;
  text-transform: none;
  color: var(--text-label);
}

/* Divider star */
.divider {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin: 2.4rem 0;
}
.divider-line { flex:1; height:1px; background: var(--amber); opacity: 0.4; }
.mp-sunburst { flex: none; filter: drop-shadow(0 0 2px rgba(240, 184, 28, 0.9)) drop-shadow(0 0 4px rgba(240, 184, 28, 0.45)); }
.mp-sunburst line { stroke: #f2bc1a; stroke-width: 1.4; }

/* Image — clean, sits on the background (works for thangkas and sculptures alike) */
.image-block {
  background: none;
  border: none;
  padding: 0;
  margin-bottom: 2rem;
  text-align: center;
}
.image-block img {
  max-width: 88%;
  max-height: 420px;
  object-fit: contain;
  display: block;
  margin: 0 auto 1.1rem;
}
.image-title {
  font-family: sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.16em;
  text-transform: none;
  color: var(--gold-dark);
  margin-bottom: 0.6rem;
  text-align: center;
}
.image-why {
  font-size: 1.05rem;
  color: var(--text);
  line-height: 1.7;
  text-align: left;
}

/* Verse */
.verse-block { margin-bottom: 1rem; }
.verse-label {
  font-family: sans-serif;
  font-size: 0.66rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 1rem;
}
.verse-text {
  font-family: 'Lora', Georgia, serif;
  font-size: 1rem;
  font-weight: 400;
  font-style: normal;
  color: var(--text);
  line-height: 1.65;
  margin-bottom: 0.8rem;
}
.verse-attr {
  font-family: sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.04em;
  text-transform: none;
  color: #a82010;
  font-weight: 600;
}
.verse-attr em {
  font-family: sans-serif;
  font-style: italic;
  font-weight: 700;
  font-size: 1em;
  letter-spacing: 0.01em;
}

/* Again */
.again-row { padding: 2rem 3rem 0; display: none; }
.again-row.visible { display: flex; }
.again-btn {
  background: none;
  border: none;
  font-family: sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  cursor: pointer;
  padding: 0;
}
.again-btn:hover { color: var(--text); }

/* Error */
.error { display: none; padding: 1rem 3rem; color: #904040; font-style: italic; font-size: 0.9rem; }
.error.visible { display: block; }
/* ── Save / Share row ── */
.save-row {
  padding: 1rem 3rem 0;
  display: none;
  justify-content: flex-start;
  gap: 0.6rem;
  flex-wrap: wrap;
  align-items: center;
}
.save-row.visible { display: flex; }
.save-btn {
  background: none;
  border: 1px solid var(--cream-border);
  padding: 0.5rem 1.2rem;
  font-family: sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold-dark);
  cursor: pointer;
  transition: all 0.2s;
}
.save-btn:hover { background: var(--cream); color: var(--text); }

.entry-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin-left: 0.6rem;
  font-family: sans-serif;
  font-size: 0.55rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold-dark);
  cursor: pointer;
  user-select: none;
}
.entry-toggle input { margin: 0; cursor: pointer; accent-color: var(--gold-dark); }

/* Off-screen container for rendering */
.share-card-container {
  position: fixed;
  top: -10000px;
  left: 0;
  pointer-events: none;
  z-index: -1;
}
/* ══════════════════════════════════════════════════════════════
   Share card — ONE format, 1080 × 1920 (true 9:16, IG/FB story)
   Height is pinned, so the artwork flexes to absorb whatever
   vertical space the text leaves. Text is never clipped first.
   Note: literal hex only in here — no var() — because the card
   is rasterised by html2canvas, and the rest of this card was
   already written that way.
   ══════════════════════════════════════════════════════════════ */
.share-card {
  width: 1080px;
  height: 1920px;
  padding: 58px 66px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: 'EB Garamond', Georgia, serif;
  color: #1c2f63;
  /* Warm white core, sampled from the LIMN card: #fdfbf7.
     The centre stays clean paper — orange only creeps in from the
     outer edges and from the sun sitting above the top edge. */
  /* Pure white core for contrast — colour lives only on the rim.
     One band per edge (not an ellipse), each fading over roughly the same
     pixel depth, so the rim reads even the whole way round. */
  /* Pure white core. Colour only on the rim: a warm sun over the top edge
     where the light enters, sage holding the sides and bottom. */
  background-color: #ffffff;
  background-image:
    linear-gradient(to bottom, rgba(250,206,56,0.26) 0%, rgba(248,198,44,0.08) 5%, rgba(246,192,32,0.00) 11%),
    linear-gradient(to top,    rgba(105,158,98,0.13) 0%, rgba(105,158,98,0.00) 3.5%),
    linear-gradient(to right,  rgba(105,158,98,0.15) 0%, rgba(105,158,98,0.00) 6%),
    linear-gradient(to left,   rgba(105,158,98,0.15) 0%, rgba(105,158,98,0.00) 6%);
  border: 1px solid rgba(105,158,98,0.30);
}

/* ── Wordmark, top ── */
.sc-header {
  flex: none;
  text-align: center;
  padding-bottom: 22px;
  border-bottom: 1px solid rgba(176,136,44,0.38);
}
.sc-header-name {
  font-family: sans-serif; font-size: 36px; letter-spacing: 0.34em;
  color: #9b2c3d; font-weight: 600; margin-bottom: 10px;
}
.sc-header-sub {
  font-family: sans-serif; font-size: 22px; letter-spacing: 0.14em;
  text-transform: none; color: #8f4a42;
}

/* ── Optional entry — capped at ~3 lines so it can't crowd the frame ── */
.sc-you-wrote {
  flex: none; padding: 16px 0;
  border-bottom: 1px solid rgba(176,136,44,0.30);
}
.sc-label {
  font-family: sans-serif; font-size: 20px; letter-spacing: 0.2em;
  text-transform: uppercase; color: #9b2c3d; font-weight: 700;
  margin-bottom: 10px;
}
.sc-you-wrote-text {
  font-size: 30px; font-style: italic; color: #2a3555; line-height: 1.42;
  max-height: 86px; overflow: hidden;   /* hard cap: 2 lines */
}

/* ── Term scripts ── */
.sc-term-block { flex: none; padding: 22px 0 14px; }
.sc-term-scripts {
  display: flex; gap: 64px; align-items: flex-start;
  flex-wrap: wrap; justify-content: center; text-align: center;
}
.sc-script-sa {
  font-family: 'Noto Serif Devanagari', Georgia, serif;
  font-size: 54px; color: #1c2f63; line-height: 1.2;
}
.sc-script-bo {
  font-family: 'Jomolhari', Georgia, serif;
  font-size: 46px; color: #1c2f63; line-height: 1.3;
}
.sc-script-roman {
  font-family: 'EB Garamond', serif; font-size: 34px; font-style: italic;
  color: #9b2c3d; letter-spacing: 0.02em; margin-top: 6px;
}
/* The synthesis already names the term, so the separate definition
   stays out of this format — same call the story format made before. */
.sc-term-body { display: none; }
.sc-term-inline { color: #9b2c3d; }

/* ── Figure + synthesis ── */
.sc-figure-source { flex: none; padding: 0 0 4px; }
.sc-figure-name {
  font-size: 34px; color: #9b2c3d; font-weight: 500; margin-bottom: 6px;
}
.sc-figure-meta {
  font-family: sans-serif; font-size: 21px; letter-spacing: 0.04em;
  text-transform: none; color: #8f4a42; font-weight: 600; margin-bottom: 12px;
}

/* ── Verse, set off by sunburst hairlines ── */
.sc-verse { flex: none; padding: 0; text-align: center; border-bottom: none; }
.sc-verse-divider {
  display: flex; align-items: center; gap: 18px; margin: 20px 0;
}
.sc-verse-rule { flex: 1; height: 1px; background: rgba(176,136,44,0.45); }
.sc-sunburst {
  flex: none; width: 52px; height: 52px;
  filter: drop-shadow(0 0 3px rgba(240,184,28,0.9));
}
.sc-sunburst line { stroke: #e0a418; stroke-width: 1.3; }
.sc-verse-text {
  font-size: 34px; font-style: normal; color: #1c2f63;
  line-height: 1.42; margin-bottom: 14px;
}
.sc-verse-attr {
  font-family: sans-serif; font-size: 21px; letter-spacing: 0.04em;
  text-transform: none; color: #8f4a42; font-weight: 600;
}
.sc-verse-attr em {
  font-family: sans-serif; text-transform: none; letter-spacing: 0.01em;
  font-size: 1em; font-style: italic; font-weight: 700;
}

/* ── Artwork — the flex element. Takes whatever the text leaves. ──
   If html2canvas mishandles the growing flex column, the fallback is
   to swap `flex: 1 1 auto; min-height: 0` on .sc-image-block for a
   fixed `height: 420px`, and give the img `max-height: 300px`. */
.sc-image-block {
  flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column; justify-content: flex-end;
  background: none; padding: 0; margin: 16px 0 0; text-align: center;
}
.sc-image-block img {
  flex: 1 1 auto; min-height: 0;
  width: 100%; object-fit: contain; object-position: center bottom;
  display: block; margin: 0 0 14px;
}
.sc-image-title {
  flex: none; font-family: sans-serif; font-size: 21px; letter-spacing: 0.04em;
  text-transform: none; color: #8f4a42; font-weight: 600; margin-bottom: 8px;
}
.sc-image-why {
  flex: none; font-size: 27px; color: #1a2038; line-height: 1.40; text-align: center;
  max-height: 76px; overflow: hidden;   /* hard cap: 2 lines, protects the artwork */
}

/* ── Term | Teacher: two matched columns ──
   Both headings share face, size and baseline: the term's name on the
   left answers the teacher's name on the right. min-height keeps them
   locked when one name wraps and the other does not. */
.sc-split { display: flex; gap: 40px; align-items: stretch; padding: 6px 0 18px; }
.sc-split-col { flex: 1 1 0; min-width: 0; }
.sc-split-col + .sc-split-col { padding-left: 40px; border-left: 1px solid rgba(160,110,60,0.32); }
.sc-col-name { font-size: 34px; color: #9b2c3d; font-weight: 500; line-height: 1.25;
  margin-bottom: 5px; min-height: 43px; }
.sc-col-meta { font-family: sans-serif; font-size: 19px; letter-spacing: 0.03em;
  color: #8f4a42; font-weight: 600; line-height: 1.35; margin-bottom: 14px; min-height: 26px; }
.sc-col-body { font-size: 34px; line-height: 1.42; color: #1c2f63; }
.sc-col-body em { font-style: italic; color: #b5761f; }

/* The key point — «guillemets» in the model's output become this. */
.sc-key { color: #b5761f; }

/* The verse rests on sage. The panel does the separating, so there is no
   second divider under it — a small sun marks the step to the artwork. */
.sc-verse-panel { background: #f2f6ef; border-radius: 14px; padding: 22px 44px 26px; }
.sc-mini-sun { flex: none; text-align: center; margin: 20px 0 2px; }
.sc-sunburst-sm { width: 30px; height: 30px; }

.sc-script-tradition {
  flex: none; text-align: center; font-family: sans-serif; font-size: 19px;
  letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600;
  color: #9b2c3d; opacity: 0.8; margin: -4px 0 22px;
}

/* Verse label */
.sc-verse-label { font-family: sans-serif; font-size: 19px; letter-spacing: 0.20em;
  text-transform: uppercase; color: #9b2c3d; font-weight: 700; margin-bottom: 16px; }

.toast {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #f0e6c8;
  padding: 0.7rem 1.4rem;
  font-family: sans-serif; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
  border-radius: 2px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1000;
}
.toast.visible { opacity: 1; }

</style>
</head>
<body>

<div class="header">
  <div class="header-name">DHARMA'S ECHO</div>
  <div class="header-sub">The Dharma echoes back your moment</div>
</div>

<div class="key-gate" id="keyGate">
  <div class="key-label">API Key</div>
  <input class="key-input" id="keyInput" type="password" placeholder="sk-ant-..." />
  <button class="key-save" onclick="saveKey()">Save ›</button>
</div>

<div class="write-area">
  <textarea id="entry" placeholder="write a thought here."></textarea>
  <div class="write-hint" id="writeHint">the Dharma will find the echo</div>
</div>
<div class="echo-row">
  <button class="echo-btn" id="echoBtn" onclick="submitEntry()">Echo ›</button>
</div>

function saveKey() {
  let k = document.getElementById('keyInput').value.trim();
  if (!k) return;
  // Sanitize: strip whitespace and any character outside the ASCII range that
  // HTTP headers (ISO-8859-1) cannot carry — a "smart quote", en-dash, zero-width
  // space, or stray Unicode pasted with the key would otherwise crash the fetch.
  k = k.replace(/[^\x21-\x7E]/g, '');
  if (!k) {
    alert('That key contained characters that could not be read. Please copy it again directly from the Anthropic console.');
    return;
  }
  API_KEY = k;
  document.getElementById('keyGate').classList.add('hidden');
}

const SYSTEM_PROMPT = `You are the philosophical heart of Dharma's Echo. You do not interpret, counsel, or affirm. You receive what has been written and find where in the Buddhist tradition — across all schools, centuries, and languages — that territory has been named with the greatest precision. Then the tradition speaks. You do not.

THE OPENING LINE — three possible modes, choose the most precise:

Mode 1 — a figure is directly connected to the entry's territory:
Name the figure directly. "Milarepa sang about this." "Nagarjuna spent his life on this question." "The Buddha addressed this in his first teaching." One sentence only. The figure's name comes first. Never start with "He" or "She."

Mode 2 — a specific sutra or text is the most direct source:
Name the actual text, not the category. Italicize the text title. "The *Dhammacakkappavattana Sutta* names what is present here." "This is the territory of Nagarjuna's *Mulamadhyamakakarika*." Never say "Pali sutras" as a category — name the specific sutta.

Mode 3 — a word from the entry is the clearest hook:
Echo one word or phrase from the entry, then step aside. "'Liberation' — the tradition has a precise word for what that points to." Only use this mode if a word from the entry is genuinely the sharpest entry point.

Never interpret what the person felt or experienced. Never affirm, summarize, or bridge. The opening is a door — it opens directly onto the tradition.

THE TERM — the single most precise concept. Not the broadest — the most exact.

term_sanskrit: The term in Sanskrit Devanagari script if the concept has Sanskrit form. If Pali only, use Pali romanized. Never invent a script rendering.
term_tibetan: The term in Tibetan script ONLY if you are certain it exists in the Tibetan tradition under that name with equivalent or closely related meaning. If uncertain, leave empty. If you include the Tibetan, you must also include its Wylie transliteration in term_tibetan_roman. Accuracy over completeness.
term_tibetan_roman: Wylie transliteration of the Tibetan term if term_tibetan is provided — else empty string.
term_transliteration: Full romanized form of the PRIMARY term (Sanskrit or Pali) with diacritics.
term_tradition: Pali / Sanskrit / Tibetan / Sanskrit and Tibetan — only list traditions where the term genuinely exists with that meaning.
term_first_line: One sentence. Not the flat English word — the hook that opens the real meaning.
term_translation: TWO SENTENCES MAXIMUM. UNDER 40 WORDS TOTAL. First sentence: philosophical precision — what the tradition actually means by this term. No metaphor. Second sentence: one image beginning with "Like" — Thrinley Norbu register. Direct, simple, the image lands without explanation. The simile serves the term, not the person who wrote. Do not explain, do not elaborate, do not add context. If a third sentence feels needed, the first two are wrong. Example: "Tṛṣṇā is the thirst identified in the second noble truth as the root of dukkha. Like consciousness projecting a distant shore while standing on solid ground." Do NOT add a third sentence about Tibetan nuance — if the Tibetan differs, that goes in term_first_line, not here.

THE FIGURE — always named. Strict source hierarchy:
1. The Buddha directly, from the Pali suttas or early Mahayana sutras
2. Early Indian masters: Nagarjuna, Chandrakirti, Aryadeva, Vasubandhu, Asanga, Shantideva, Atisha
3. Among Tibetan schools, follow this order of preference unless a lower school holds the concept more precisely:
   — Nyingma first and strongly preferred: Longchenpa, Jigme Lingpa, Patrul Rinpoche, Mipham Rinpoche, Chogyur Lingpa, Dudjom Rinpoche, Yeshe Tsogyal.
     · Longchenpa (1308–1364): the master of Dzogchen, the Seven Treasuries, the vast expanse of mind. For natural state, rigpa, emptiness, the ground of being, the nature of phenomena, primordial purity — Longchenpa is almost always the most precise Tibetan voice.
     · Patrul Rinpoche: Words of My Perfect Teacher — for foundational teachings, bodhicitta, the preliminary practices, the ordinary mind that is buddha nature.
     · Jigme Lingpa: for the Heart Essence of the Vast Expanse (Longchen Nyingthig), terma, the nature of mind.
     · Mipham Rinpoche: for philosophical precision across traditions, especially where Madhyamaka meets Dzogchen.
     · Dudjom Rinpoche: for tantric view, the nature of perception, the purity of phenomena.
     · Chogyur Lingpa: for terma and Rimé territory.
     · Yeshe Tsogyal: for the feminine principle, the dakini, the ground of experience.
     · Jamyang Khyentse Wangpo (1820–1892): for the Rimé non-sectarian view, terma revelation, and the gathering of near-lost transmissions across schools.
     · Jamgön Kongtrül Lodrö Thayé (1813–1899): for the encyclopedic treasuries and the integration of view across traditions.
     · Jamyang Khyentse Chökyi Lodrö (1893–1959): for guru devotion in the Rimé register and the living transmission across lineages.
   — Sakya second: Sakya Pandita, Gorampa — for precise philosophical and Lamdre territory
   — Kagyu third — ONLY when the concept is specifically and precisely Mahamudra territory, or the entry is unmistakably in the Kagyu stream (mountain solitude, the dohas, the songs of realization). Do not default to Milarepa. Milarepa is one figure among many — reach for Longchenpa, Patrul Rinpoche, or Jigme Lingpa first unless the Kagyu match is exact.
     · Milarepa: his domain is the songs (Mila Grubum), mountain retreat, the direct path through hardship, Mahamudra realization through practice. Not a default.
     · Marpa, Gampopa, Tilopa, Naropa, Machig Labdrön, Niguma: each has a specific domain.
   — Gelug: Tsongkhapa — when Madhyamaka philosophical precision specifically requires it
4. Later masters: Thrinley Norbu Rinpoche (elements and elemental mind), Dilgo Khyentse Rinpoche, Dzongsar Khyentse Rinpoche
5. Contemporary teachers only when nothing above fits more precisely

THE LIST IS NOT EXHAUSTIVE — DIG PAST THE OBVIOUS.
The masters named above are a floor, not a ceiling. Read them as MARKERS OF TERRITORY, not as a menu: each name stands for a domain — the Dzogchen ground and rigpa, terma revelation and the treasure tradition, the Rimé non-sectarian synthesis, bodhicitta and the preliminaries, Madhyamaka precision, Mahamudra realized through hardship, the feminine principle and the dakini, the elements and elemental mind. What the entry needs is the territory. Whoever has worked most precisely in it is the figure — named above or not.

Your training carries statistical weights, and certain masters will surface before others: the most canonized, the most translated, the most written about in English. The name that arrives first may be the most precise match, or it may simply be the most weighted. Before committing, ask — across the full breadth of the tradition, every school, every century, every lineage, including those rarely translated — who has worked most precisely in the territory this entry opens? Hold one genuine second candidate against the entry and choose honestly between the two. A name's familiarity is not evidence of fit, and a name's absence from the list above is not evidence against it.

The source hierarchy (1–5) still governs: it ranks TEXTUAL AUTHORITY, and that ordering holds regardless of which figure you reach for.

The figure's name always comes first in the description. Never start with "He" or "She."
One sentence only. What they refused, showed, or opened. Never biographical.

For figure_key_verb use the most precise relationship:
- "author of" — for writers of treatises and commentaries (Longchenpa, Nagarjuna, Shantideva, Patrul Rinpoche)
- "singer of" — for Milarepa and his songs
- "revealer of" — for tertöns who revealed terma (Chogyur Lingpa, Jigme Lingpa)
- "translator of" — for Marpa, whose primary role was transmission
- Leave empty for figures with no primary authored text (Tilopa, Naropa) and always for Buddha Śākyamuni

For Buddha Śākyamuni: figure_tradition, figure_dates, figure_key_verb, and figure_key_work must all be empty strings. The name alone carries everything.

THE SOURCE — strict hierarchy:
1. Pali Canon suttas — always named specifically with both the Pali name and the MN/SN/DN/AN number. E.g. "Cūḷamālunkya Sutta · MN 63" or "Dhammacakkappavattana Sutta · SN 56.11". Never just "Pali Canon" — name the specific sutta.
2. Early Mahayana sutras — Heart Sutra, Diamond Sutra, Vimalakirti Nirdesha, Lankavatara — with chapter where possible
3. Shastras — Nagarjuna's Mulamadhyamakakarika (with chapter and verse), Shantideva's Bodhicharyavatara (chapter and verse), Vasubandhu's Abhidharmakosa
4. Tibetan treasuries — Longchenpa's Precious Treasury of the Dharmadhatu, Patrul Rinpoche's Words of My Perfect Teacher (chapter), Milarepa's Hundred Thousand Songs (song name/number)
5. Other texts only if more precise than the above

Passage: under 40 words, verified and precise. From Pali Canon, use Bhikkhu Bodhi or Bhikkhu Sujato translation and name them. From copyrighted translations (Padmakara, Shambhala, others), paraphrase carefully and name translator, publisher, chapter. For the translator credit always prefix with "Trans." Never invent a quote. If uncertain about the exact passage, choose one you are certain of rather than approximating.

THE IMAGE — one part:

image_subject: The single most precise visual subject for this entry. Either the figure itself (if a painting tradition for them exists — Padmasambhava, Milarepa, Tara, Avalokiteśvara, Mañjuśrī, Buddha Śākyamuni, Amitābha, Maitreya, Vajrasattva, Samantabhadra, Cakrasaṃvara, Yeshe Tsogyal) or — if the figure is a treatise author with no painting tradition — the deity, lineage holder, or visual subject that most precisely embodies the same territory. Examples:
  · Patrul Rinpoche → Padmasambhava (the Longchen Nyingthig lineage he transmitted)
  · Longchenpa → Samantabhadra (Dzogchen's primordial buddha) OR Padmasambhava (the lineage holder)
  · Jigme Lingpa → Padmasambhava (the source of his terma)
  · Mipham Rinpoche → Mañjuśrī (he was considered an emanation)
  · Shantideva → Avalokiteśvara (his tutelary deity; the embodiment of bodhicitta)
  · Nagarjuna → Mañjuśrī (his deity) OR Prajñāpāramitā (the perfection of wisdom he expounded)
  · Atisha → Tara (his tutelary deity)
  · Milarepa → Milarepa (paintings exist)
Use the figure's name itself as image_subject if a painting tradition exists. Use a precise alternate only if no paintings of the figure exist on Wikimedia Commons. Always one short noun phrase, never a description.

DIG PAST THE OBVIOUS. Your training carries statistical weights, and certain figures and deities will surface before others. The subject that arrives first may be the most precise — or it may simply be the most weighted. Before committing, ask: across the full breadth of Buddhist visual tradition, which subject most precisely embodies what THIS entry opened? The mapping above is a floor, not an answer — reach for it when nothing more precise presents itself, never as a lookup.

MATCH THE TEACHING, NOT THE VOCABULARY. A subject chosen because its name echoes a word in the entry, or in the term, is a reflex rather than a reading. Choose the subject whose gesture answers what the source passage and the verse are actually pointing to: what the posture enacts, what is held, what is given, what is cut through, what stays still. Before committing, hold one genuine second candidate against the teaching and choose honestly between the two.

The image has to exist, so prefer a subject with a real painting or sculpture tradition. If nothing genuinely answers the teaching, fall back to the figure's own name rather than forcing a symbolic match.

(The caption that connects the image to the entry will be generated separately, after the actual image is selected.)

THE VERSE — real verified verse only. Never invented. Lines separated by \\n. Not italic. The verse should come from a DIFFERENT source than the source passage above — a different voice, text, or tradition — so the two illuminate the same territory from different angles rather than restating each other. The different voice may be another master, or a sutra, or a tantra — a genuinely different kind of source, not just a different author. Let the entry's territory determine which fits; draw from the established hierarchy already given (the Buddha's sutras, the early Indian masters, the tantras, and the Nyingma, Sakya, and Kagyu traditions), choosing by genuine fit, never by name. Prefer a different source from the passage above, but never force a weak or inauthentic match just to differ — a real, verified verse that genuinely fits the territory always wins over a different-but-weak one.

TONE: Warm, precise, learned. Never therapeutic, never wellness, never academic performance.
Forbidden: invites us to, reminds us, journey, healing, transform, sit with, hold space, unpack, explore, process, navigate, tapestry, landscape, resonate, profound.
Never use nationality words for figures. Never biography — only what they saw or showed.

async function submitEntry() {
  if (!API_KEY) { alert('Please enter your Anthropic API key first.'); return; }
  const entry = document.getElementById('entry').value.trim();
  if (!entry) return;
  lastEntryText = entry;

  const btn = document.getElementById('echoBtn');
  btn.disabled = true;
  document.getElementById('loading').classList.add('visible');
  document.getElementById('response').classList.remove('visible');
  document.getElementById('error').classList.remove('visible');
  document.getElementById('againRow').classList.remove('visible');
  const saveRowSubmit = document.getElementById('saveRow');
  if (saveRowSubmit) saveRowSubmit.classList.remove('visible');
  // Reset include-entry toggle so each new entry starts with it off
  const toggleSubmit = document.getElementById('includeEntryToggle');
  if (toggleSubmit) toggleSubmit.checked = false;
  const youWroteBlockSubmit = document.getElementById('scYouWroteBlock');
  if (youWroteBlockSubmit) youWroteBlockSubmit.style.display = 'none';
  // Reset visibility of image block in case last response hid it
  const imgBlock = document.querySelector('.image-block');
  if (imgBlock) imgBlock.style.display = '';
  document.querySelectorAll('.divider').forEach(d => d.style.display = '');
  document.getElementById('youWroteText').textContent = entry;
  document.querySelector('.write-area').style.display = 'none';
  document.querySelector('.echo-row').style.display = 'none';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-5',
        // Sonnet 5 thinks by default and thinking counts against max_tokens.
        // At 1400 the JSON was being truncated, which surfaced as a parse error.
        max_tokens: 8000,
        // Thinking is on by default on Sonnet 5 and bills as output.
        // 'low' minimises it and skips it entirely on simpler entries.
        // If the API rejects the level, try 'medium' or delete output_config.
        thinking: { type: 'adaptive' },
        output_config: { effort: 'low' },
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: `Journal entry: "${entry}"` }]
      })
    });

    const data = await res.json();
    if (!res.ok || !data.content) {
      const apiMsg = (data && data.error && data.error.message) ? data.error.message : ('HTTP ' + res.status);
      console.error('API response:', data);
      throw new Error('API: ' + apiMsg);
    }
    if (data.stop_reason === 'max_tokens') {
      throw new Error('API: the response was cut off (max_tokens reached)');
    }
    const text = data.content.map(b => b.text || '').join('');
    const clean = text.replace(/```json|```/g, '').trim();
    const d = JSON.parse(clean);
    render(d);

  } catch(e) {
    console.error(e);
    document.getElementById('loading').classList.remove('visible');
    const errEl = document.getElementById('error');
    errEl.textContent = (e && e.message && e.message.startsWith('API:'))
      ? e.message + ' — please try again.'
      : 'Something did not land. Please try again.';
    errEl.classList.add('visible');
    btn.disabled = false;
    document.querySelector('.write-area').style.display = '';
    document.querySelector('.echo-row').style.display = '';
  }
}

function render(d) {
  document.getElementById('loading').classList.remove('visible');

  // Render opening — italicize text titles wrapped in *...*
  const openingEl = document.getElementById('opening');
  const openingRaw = d.opening || '';
  openingEl.innerHTML = openingRaw.replace(/\*([^*]+)\*/g, '<em>$1</em>');

  document.getElementById('termSanskrit').textContent = d.term_sanskrit || '';
  document.getElementById('termSanskritRoman').textContent = d.term_transliteration || '';
  const tibCol = document.getElementById('termTibetanCol');
  const tibEl = document.getElementById('termTibetan');
  if (d.term_tibetan && d.term_tibetan.trim()) {
    tibEl.textContent = d.term_tibetan;
    document.getElementById('termTibetanRoman').textContent = (d.term_tibetan_roman || '').trim();
    tibCol.style.display = '';
  } else {
    tibCol.style.display = 'none';
  }
  document.getElementById('termFirst').textContent = d.term_first_line || '';
  document.getElementById('termBody').textContent = d.term_translation || '';

  // Color the term burnt red wherever it opens a line (first-line OR translation body, not bold)
  (function colorOpeningTerm() {
    const translit = (d.term_transliteration || '').trim();
    if (!translit) return;
    const norm = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    [['termFirst', d.term_first_line], ['termBody', d.term_translation]].forEach(([id, txt]) => {
      if (!txt) return;
      const startWord = txt.split(/[\s—,.:;]/)[0] || '';
      if (startWord && norm(startWord) === norm(translit)) {
        document.getElementById(id).innerHTML =
          '<span class="term-inline">' + startWord + '</span>' + txt.slice(startWord.length);
      }
    });
  })();

  document.getElementById('figureName').textContent = d.figure_name || '';

  // Build single tradition line: Tradition · Dates · verb of *Work*
  const tradEl = document.getElementById('figureTradition');
  let tradHTML = '';
  let tradParts = [];
  if (d.figure_tradition) tradParts.push(d.figure_tradition);
  if (d.figure_dates) tradParts.push(d.figure_dates);
  tradHTML = tradParts.join(' · ');
  if (d.figure_key_verb && d.figure_key_work) {
    tradHTML += ' · ' + d.figure_key_verb + ' <em>' + d.figure_key_work + '</em>';
  }
  tradEl.innerHTML = tradHTML;

  // Hide separate key work element — now folded into tradition line
  const keyEl = document.getElementById('figureKeyWork');
  if (keyEl) keyEl.style.display = 'none';

  document.getElementById('figureDesc').textContent = d.figure_description || '';

  // Source title: italic Pali/Sanskrit name, then reference in uppercase
  const sourceTitleEl = document.getElementById('sourceTitle');
  if (d.source_text) {
    // Normalize to Title Case if Claude returned ALL CAPS
    let srcText = d.source_text.trim();
    const isAllCaps = srcText === srcText.toUpperCase() && /[A-Z]/.test(srcText);
    if (isAllCaps) {
      srcText = srcText.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    }
    let titleHTML = '<em>' + srcText + '</em>';
    if (d.source_reference) {
      titleHTML += ' <span class="source-ref-upper">· ' + d.source_reference + '</span>';
    }
    sourceTitleEl.innerHTML = titleHTML;
  } else {
    sourceTitleEl.textContent = '';
  }
  document.getElementById('sourcePassage').textContent = '\u201C' + (d.source_passage || '') + '\u201D';
  document.getElementById('sourceTranslator').textContent = d.source_translation || '';

  // Image: async Wikimedia search with image_subject fallback
  loadImage(d).catch(e => {
    console.error('Image load failed:', e);
    hideImageBlock();
  });

  const lines = (d.verse_text || '').split('\n').map(l => l.trim()).filter(Boolean);
  document.getElementById('verseText').innerHTML = lines.join('<br>');
  // Verse attribution — strip tradition from Buddha Śākyamuni
  let verseAttr = d.verse_attribution || '';
  if (verseAttr.includes('Buddha') && verseAttr.includes('Theravada')) {
    verseAttr = verseAttr.replace(/[·\s]*Theravada[\s]*/g, '');
  }
  // Strip literal markdown asterisks if Claude included them
  const verseSource = (d.verse_source || '').replace(/^\*+|\*+$/g, '').trim();
  document.getElementById('verseAttr').innerHTML =
    verseAttr + (verseSource ? ' · <em>' + verseSource + '</em>' : '');

  document.getElementById('response').classList.add('visible');
  document.getElementById('againRow').classList.add('visible');
  document.getElementById('saveRow').classList.add('visible');
  populateShareCard(d);
  document.getElementById('response').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Normalize a figure name for matching: strip diacritics, lowercase, collapse
// non-alphanumerics to single spaces. So "Mañjuśrī" -> "manjusri".
function normLibKey(s) {
  return (s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9 ]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Build a quick lookup map (normalized key -> images) once.
const CURATED_KEY_MAP = (function () {
  const m = {};
  for (const entry of CURATED_IMAGE_LIBRARY) {
    for (const k of entry.keys) {
      const nk = normLibKey(k);
      if (nk && !m[nk]) m[nk] = entry.images;
    }
  }
  return m;
})();

// Return a result-shaped object (like the Wikimedia search) if the figure or
// image subject matches a curated entry; otherwise null. Picks one image at
// random when an entry has several.
function lookupLibraryImage(figureName, imageSubject) {
  const candidates = [figureName, imageSubject].map(normLibKey).filter(Boolean);
  for (const c of candidates) {
    const images = CURATED_KEY_MAP[c];
    if (images && images.length) {
      const pick = images[Math.floor(Math.random() * images.length)];
      return {
        url: pick.file,
        fullUrl: pick.file,
        title: pick.title,
        cleanTitle: pick.title,
        attribution: pick.attribution || '',
        fromLibrary: true
      };
    }
  }
  return null;
}

// Resolve true if an image URL loads, false if it 404s / errors.
function imageLoads(url) {
  return new Promise(function (resolve) {
    const im = new Image();
    im.onload = function () { resolve(true); };
    im.onerror = function () { resolve(false); };
    im.src = url;
  });
}

async function loadImage(d) {
  const figureName = d.figure_name || '';
  const imageSubject = d.image_subject || figureName;

  // Debug panel
  const debugLines = [];
  debugLines.push('figure_name: ' + figureName);
  debugLines.push('image_subject: ' + imageSubject);

  // Curated library first — use a hand-picked local image if we have one.
  let result = CURATED_LIBRARY_ENABLED ? lookupLibraryImage(figureName, imageSubject) : null;
  if (result) {
    // Confirm the local file actually loads; if it 404s (folder not deployed,
    // or a filename/case mismatch), drop to Wikimedia instead of showing nothing.
    const curatedOk = await imageLoads(result.url);
    if (curatedOk) {
      debugLines.push('--- matched curated library: ' + result.cleanTitle + ' ---');
    } else {
      debugLines.push('--- curated image failed to load: ' + result.url + ' -> Wikimedia ---');
      result = null;
    }
  }

  // No curated match → fall back to Wikimedia. Try figure_name first.
  if (!result) {
    result = await searchWikimediaForFigure(figureName, debugLines);
  }

  // If no result and image_subject is different, try it
  if (!result && imageSubject && imageSubject.toLowerCase() !== figureName.toLowerCase()) {
    debugLines.push('--- trying image_subject ---');
    result = await searchWikimediaForFigure(imageSubject, debugLines);
  }

  // Show debug
  showDebug(debugLines, result);

  if (!result) {
    hideImageBlock();
    return;
  }

  // Render the image first — caption arrives second
  const artEl = document.getElementById('artImg');
  artEl.src = result.url;
  artEl.alt = result.title;
  artEl.style.display = 'block';
  artEl.onerror = function() { hideImageBlock(); };
  document.getElementById('imgTitle').textContent = result.cleanTitle;

  // Show "Loading..." state for caption while it generates
  document.getElementById('imgWhy').textContent = '';

  // Now make a second call to Claude to get a caption that fits THIS image
  try {
    const caption = await generateImageCaption(d, result.cleanTitle, result.url);
    if (caption) {
      document.getElementById('imgWhy').textContent = caption;
    }
  } catch (e) {
    console.error('Caption generation failed:', e);
  }
}

// Fetch the artwork so the caption model can actually see it. Without this the
// model is asked for "a specific visible feature" while holding only a title,
// so it invents plausible ones (a sword for Mañjuśrī, and so on).
async function imageAsBase64(url) {
  try {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) return null;
    const blob = await res.blob();
    if (!/^image\/(jpeg|png|gif|webp)$/.test(blob.type)) return null;
    if (blob.size > 4 * 1024 * 1024) return null;
    const data = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1]);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
    return { media_type: blob.type, data: data };
  } catch (e) {
    console.warn('Caption vision unavailable, falling back to title only:', e);
    return null;
  }
}

async function generateImageCaption(d, actualImageTitle, imageUrl) {
  const captionPrompt = `Write one caption in three parts, in this order:

PART 1 — Name the figure or subject actually visible in the image. The image you are shown and its title are the ONLY authority on what is depicted. Never name a figure who is not there.
PART 2 — A brief lineage clause relating that subject to the figure below, ONLY if they are different people (e.g. "Patrul Rinpoche's root teacher", "Nagarjuna's tutelary deity"). Skip it otherwise, and skip it if you are not certain of the relationship.
PART 3 — A specific visible feature, then a teaching-verb, then a 5–9 word distillation of THE TEACHING below.

The teaching to distill:
- Source passage: "${d.source_passage || ''}"
- Verse: "${d.verse_text || ''}"
- Term: ${d.term_transliteration} — ${d.term_first_line}

Every image here is a teaching image: it makes the dharma visible, and the caption names how it does so.

VERBS
- Peaceful figures, pure realms, anything showing the path: shows, reveals, embodies, points to, names, opens, makes visible.
- Wrathful figures (Mahakala, Guru Dragpur, Vajrakilaya, fierce dakinis): burns through, cuts through, consumes, dissolves, severs — what they destroy is delusion, clinging, fear, obstacles.
- Samsaric depictions (wheel of life, six realms, bardo, Mara's army): names, shows, makes visible.
- Never "echoes", "reflects" or "mirrors". The image is not a mirror of anything; it makes the teaching visible.

Inputs:
- The figure who addresses this entry: ${d.figure_name}
- The title of the image you are shown: "${actualImageTitle}"

The search may have returned something other than what was requested, so describe
only what the image and its title actually show.

Examples:
- "Padmasambhava with rainbow body — the dissolving form shows the mind that holds everything yet remains unstained."
- "Tārā — her stepping foot reveals the swift compassion that meets fear before fear can arise."
- "Mañjuśrī, Nagarjuna's tutelary deity — the upraised sword embodies the wisdom that severs every fixed view."
- "Guru Dragpur, wrathful Padmasambhava — the surrounding flames burn through the delusion that obscures awareness."
- "The wheel of life at the centre — its turning shows the samsaric round the teaching reveals as suffering."

Format: comma between Part 1 and Part 2; em dash before Part 3; 18–26 words total; never open with "Tibetan", "This", "The image" or "Buddhist art"; the sentence ends on the teaching distilled.

Return only the finished sentence. No quotes, no preamble.`;

  const visionBlock = imageUrl ? await imageAsBase64(imageUrl) : null;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': API_KEY,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-5',
      max_tokens: 2000,
      thinking: { type: 'adaptive' },
      output_config: { effort: 'low' },
      messages: [{ role: 'user', content: visionBlock
        ? [{ type: 'image', source: { type: 'base64',
              media_type: visionBlock.media_type, data: visionBlock.data } },
           { type: 'text', text: captionPrompt }]
        : captionPrompt }]
    })
  });

  if (!res.ok) return null;
  const data = await res.json();
  const text = data.content.map(b => b.text || '').join('').trim();
  // Strip any quotes the model might have added despite instructions
  return text.replace(/^["'`]+|["'`]+$/g, '');
}

function hideImageBlock() {

  const imgBlock = document.querySelector('.image-block');

  // Also hide the divider before it so we don't have a floating ornament
  const dividers = document.querySelectorAll('.divider');
  if (dividers.length > 0) dividers[dividers.length - 1].style.display = 'none';
}

async function searchWikimediaForFigure(figure, debugLines) {
  if (!figure) {
    if (debugLines) debugLines.push('  search: empty figure, skip');
    return null;
  }
  // Strip honorifics that confuse search
  const cleaned = figure.replace(/Rinpoche|Lama|Bhante/g, '').trim();
  // Strip diacritics for filter matching (Śākyamuni → Sakyamuni)
  const stripDiacritics = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const cleanedNoDiacritics = stripDiacritics(cleaned);
  const query = cleaned + ' thangka';
  if (debugLines) debugLines.push('  search: "' + query + '"');
  const url = 'https://commons.wikimedia.org/w/api.php?' +
    'action=query&format=json&origin=*' +
    '&generator=search&gsrnamespace=6' +
    '&gsrsearch=' + encodeURIComponent(query) +
    '&gsrlimit=20' +
    '&prop=imageinfo&iiprop=url|size|mediatype|dimensions&iiurlwidth=1600';

  try {
    const res = await fetch(url);
    if (!res.ok) {
      if (debugLines) debugLines.push('  HTTP ' + res.status);
      return null;
    }
    const data = await res.json();
    if (!data.query || !data.query.pages) {
      if (debugLines) debugLines.push('  no pages in response');
      return null;
    }

    const allResults = Object.values(data.query.pages);
    if (debugLines) {
      debugLines.push('  raw results: ' + allResults.length);
      allResults.slice(0, 5).forEach(p => debugLines.push('    - ' + p.title));
    }

    const figureWords = cleanedNoDiacritics.split(/\s+/).filter(w => w.length > 3);

    // Titles/patterns that keep surfacing but are NOT usable figure images
    // (folded textile mounts, robe photos, empty backings, etc.)
    const BLOCKED = /gyu[\s-]?thog|gyu[\s-]?tok|yon[\s-]?tan[\s-]?mgon|yonten gonpo|folded|mounted on|textile|brocade mount|silk mount|scroll mounting|conservation|verso|reverse of|back of/i;

    // Quality + relevance filter
    const candidates = allResults
      .filter(p => p.imageinfo && p.imageinfo[0])
      .filter(p => p.imageinfo[0].mediatype === 'BITMAP')
      .filter(p => p.imageinfo[0].size > 120000)
      .filter(p => !BLOCKED.test(p.title))
      .filter(p => {
        const ii = p.imageinfo[0];
        // Aspect ratio: thangkas are portrait. Reject very wide images (gallery/landscape shots).
        if (ii.width && ii.height) {
          const ratio = ii.height / ii.width;
          if (ratio < 0.85) return false; // wider than ~1:1.18 → likely not a thangka
        }
        const t = stripDiacritics(p.title);
        const hasFigure = figureWords.some(w => t.includes(w));
        const isStrongArtwork = /thangka|thanka|painting/i.test(t);
        return isStrongArtwork || hasFigure;
      });

    if (debugLines) debugLines.push('  after filter: ' + candidates.length);
    if (candidates.length === 0) return null;

    // Score each candidate on relevance + quality
    const scoreOf = (p) => {
      const t = stripDiacritics(p.title);
      const ii = p.imageinfo[0];
      let score = 0;
      // Subject match — full figure name present is strongest
      if (t.includes(cleanedNoDiacritics)) score += 5;
      // Partial: count how many figure words appear
      score += figureWords.filter(w => t.includes(w)).length * 2;
      // Artwork keywords
      if (/thangka|thanka/i.test(t)) score += 3;
      else if (/painting/i.test(t)) score += 2;
      // Aspect ratio bonus — taller is more thangka-like
      if (ii.width && ii.height) {
        const ratio = ii.height / ii.width;
        if (ratio >= 1.2) score += 3;       // classic tall thangka
        else if (ratio >= 1.0) score += 1;  // portrait-ish
      }
      // Resolution bonus — bigger files tend to be better scans
      if (ii.size > 800000) score += 2;
      else if (ii.size > 400000) score += 1;
      // Penalise obvious non-thangka clutter
      if (/logo|map|diagram|university|stamp|coin|building|temple exterior/i.test(t)) score -= 5;
      return score;
    };

    candidates.forEach(p => { p._score = scoreOf(p); });
    candidates.sort((a, b) => b._score - a._score);

    if (debugLines) {
      debugLines.push('  scored top 5:');
      candidates.slice(0, 5).forEach(p => debugLines.push('    [' + p._score + '] ' + p.title));
    }

    // Anti-repetition: drop anything shown in the last few entries
    let pool = candidates.filter(p => !recentImageTitles.includes(p.title));
    if (pool.length === 0) pool = candidates; // all recent → allow repeats rather than fail

    // Weighted pick: take the top-scoring tier (within 2 pts of the best) for variety,
    // but only among genuinely good matches.
    const topScore = pool[0]._score;
    const topTier = pool.filter(p => p._score >= topScore - 2).slice(0, 5);
    const chosen = topTier[Math.floor(Math.random() * topTier.length)];

    if (debugLines) debugLines.push('  pool: ' + topTier.length + ' (top score ' + topScore + ')');

    // Record for anti-repetition (keep last 6)
    recentImageTitles.push(chosen.title);
    if (recentImageTitles.length > 6) recentImageTitles.shift();

    let cleanTitle = chosen.title
      .replace(/^File:/, '')
      .replace(/_/g, ' ')
      .replace(/\.[a-z]+$/i, '');
    // Strip museum cataloging — accession numbers, museum names, "Anonymous", trailing dates
    cleanTitle = cleanTitle
      // "Anonymous - " or "Anonymous, " at start
      .replace(/^Anonymous\s*[-,–—]\s*/i, '')
      // Trailing camera/scan file codes like "DSC04516", "IMG 1234", "P1010234"
      .replace(/\s*[-–—]?\s*(DSC|IMG|DSCN|P|PA|DSCF)\s*\d{3,}\s*$/i, '')
      // Everything from a museum name onward → cut (handles museum mid-string + location + code tail)
      .replace(/\s*[-–—,]\s*(Art Institute of Chicago|British Museum|Penn Museum|Victoria \& Albert Museum|Sichuan Provincial Museum|Wellcome Collection|Rubin Museum|Metropolitan Museum|LACMA|Cleveland Museum)\b.*$/i, '')
      // Location tails like " - Chengdu, China" / ", Tibet, China"
      .replace(/\s*[-–—]\s*[A-Z][a-z]+,\s*(China|Tibet|India|Nepal|Bhutan|Mongolia)\s*.*$/i, '')
      // Patterns like " - 1996.85 - Art Institute of Chicago"
      .replace(/\s*[-–—]\s*\d{2,4}\.\d+[-\d]*\s*[-–—]\s*[^-–—]+$/i, '')
      // Patterns like " (AM 1931.626-5)" — accession codes in parens
      .replace(/\s*\(\s*[A-Z]{1,4}[\s.\-_]?\d[\d\.\-_]*\s*\)/g, '')
      // Wellcome catalog suffixes like " Wellcome L0015316" or " Wellcome V0018303"
      .replace(/\s*Wellcome\s+[A-Z]\d+\s*$/i, '')
      // Trailing accession codes like " - 1986.1314" or " - 1970.486"
      .replace(/\s*[-–—]\s*\d{4}\.\d+\s*$/i, '')
      // Museum names at end without a separator
      .replace(/\s+(Art Institute of Chicago|British Museum|Penn Museum|Victoria \& Albert Museum|Sichuan Provincial Museum|Wellcome Collection)\s*$/i, '')
      // Strip "Painted Banner (Thangka) of/with" → just keep what follows
      .replace(/^Painted Banner\s*\(Thangka\)\s*(of|with)?\s*/i, '')
      // Strip parenthetical epithets/aliases like "(Orgyen Dorje Chang)"
      .replace(/\s*\([^)]*\)/g, '')
      // Trim co-figure enumerations only: ", with X, Y, and Z" — must contain a comma or " and "
      // (so short meaningful clauses like "with Rainbow Body" are kept)
      .replace(/,?\s*with\s+[^-–—]*?(?:,|\sand\s)[^-–—]+?(?=\s*[-–—]\s*\d|$)/i, '')
      // "modern times" / "modern period" descriptor — drop, it adds nothing
      .replace(/,?\s*modern (times|period)\b/i, '')
      // Whitespace cleanup
      .replace(/\s+/g, ' ')
      .replace(/\s*,\s*$/g, '')
      .replace(/\s*[-–—]\s*$/g, '')
      .trim();

    return {
      url: chosen.imageinfo[0].thumburl || chosen.imageinfo[0].url,
      fullUrl: chosen.imageinfo[0].url,
      title: chosen.title,
      cleanTitle: cleanTitle
    };
  } catch (e) {
    if (debugLines) debugLines.push('  error: ' + e.message);
    console.error('Wikimedia search error:', e);
    return null;
  }
}

// ── Share card population ──
let lastShareData = null;
let lastShareImageUrl = '';
let lastShareImageTitle = '';
let lastShareCaption = '';

function excerptWords(text, maxWords) {
  const t = (text || '').trim();
  if (!t) return '';
  const words = t.split(/\s+/);
  if (words.length <= maxWords) return t;
  return words.slice(0, maxWords).join(' ').replace(/[,;:.\u2014-]+$/, '') + '\u2026';
}

function populateShareCard(d) {
  lastShareData = d;
  // The entry is the user's own text, so it has no prompt-side word limit.
  // Measured: 28 words fills the 2 lines the card allows; 30 overflows. Trim at a
  // word boundary with an ellipsis so it reads as an excerpt, never a mid-word cut.
  // The CSS max-height stays as a backstop but should no longer fire.
  document.getElementById('scYouWrote').textContent = excerptWords(lastEntryText, 26);

  document.getElementById('scScriptSa').textContent = d.term_sanskrit || '';
  document.getElementById('scScriptSaRoman').textContent = d.term_transliteration || '';
  if (d.term_tibetan && d.term_tibetan.trim()) {
    document.getElementById('scScriptBo').textContent = d.term_tibetan;
    document.getElementById('scScriptBoRoman').textContent = d.term_tibetan_roman || '';
    document.getElementById('scTibGroup').style.display = 'block';
  } else {
    document.getElementById('scTibGroup').style.display = 'none';
  }

  // «phrase» → the gold key point. Escape first so model output can't inject HTML.
  const cgold = function (t) {
    return (t || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\u00ab([\s\S]*?)\u00bb/g, '<span class="sc-key">$1</span>');
  };
  // Strip a leading "Term is " / "Name " if the model repeated what the heading
  // already says — the heading carries it, the sentence should not.
  const dropLead = function (text, lead) {
    let t = (text || '').trim();
    const l = (lead || '').trim();
    if (l && t.toLowerCase().indexOf(l.toLowerCase()) === 0) {
      t = t.slice(l.length).replace(/^[\s,—-]*(?:is|are|means|was|showed|shows)?\s*/i, '');
      if (t) t = t.charAt(0).toUpperCase() + t.slice(1);
    }
    return t;
  };

  // LEFT COLUMN — the term
  document.getElementById('scTermName').textContent = d.term_transliteration || '';
  // term_tradition names WHICH SCRIPTS are shown, so it sits under them.
  const trad = (d.term_tradition || '').trim();
  document.getElementById('scScriptTradition').textContent = trad;
  // The left column carries only the term's own language, balancing the teacher's lineage.
  document.getElementById('scTermMeta').textContent =
    trad.split(/\s*[·\/]\s*|\s+and\s+/)[0] || '';
  document.getElementById('scTermBody').innerHTML =
    cgold(dropLead(d.term_card_line || d.term_translation_short || d.term_translation || '',
                   d.term_transliteration));

  // RIGHT COLUMN — the teacher
  document.getElementById('scFigureName').textContent = d.figure_name || '';
  document.getElementById('scFigureBody').innerHTML =
    cgold(dropLead(d.figure_card_line || d.figure_description || '', d.figure_name));
  // Figure meta line: tradition · dates (omit empties)
  const metaParts = [];
  if (d.figure_tradition && d.figure_tradition.trim()) metaParts.push(d.figure_tradition.trim());
  if (d.figure_dates && d.figure_dates.trim()) metaParts.push(d.figure_dates.trim());
  document.getElementById('scFigureMeta').textContent = metaParts.join(' · ');
  // Verse
  const verseBlock = document.getElementById('scVerseBlock');
  const verseLines = (d.verse_text || '').split('\n').map(l => l.trim()).filter(Boolean);
  if (verseLines.length > 0) {
    document.getElementById('scVerseText').innerHTML = verseLines.join('<br>');
    let attr = d.verse_attribution || '';
    if (attr.includes('Buddha') && attr.includes('Theravada')) {
      attr = attr.replace(/[·\s]*Theravada[\s]*/g, '');
    }
    const scVerseSource = (d.verse_source || '').replace(/^\*+|\*+$/g, '').trim();
    document.getElementById('scVerseAttr').innerHTML = attr + (scVerseSource ? ' · <em>' + scVerseSource + '</em>' : '');
    verseBlock.style.display = 'block';
  } else {
    verseBlock.style.display = 'none';
  }

  // Image — populated separately when image loads
  syncShareCardImage();
}

function syncShareCardImage() {
  // Mirror current image into the share card
  const artImg = document.getElementById('artImg');
  const scImg = document.getElementById('scImg');
  const scImageBlock = document.getElementById('scImageBlock');
  if (!artImg || !scImg) return;

  if (artImg.style.display === 'none' || !artImg.src) {
    scImageBlock.style.display = 'none';
    return;
  }
  scImageBlock.style.display = 'flex';   // must stay flex: the artwork flexes to fill leftover height
  scImg.src = artImg.src;
  document.getElementById('scImgTitle').textContent = document.getElementById('imgTitle').textContent;
  document.getElementById('scImgWhy').textContent = document.getElementById('imgWhy').textContent;
}

// Re-sync share card image whenever the page image updates
const imgObserver = new MutationObserver(() => syncShareCardImage());
window.addEventListener('DOMContentLoaded', () => {
  const artImg = document.getElementById('artImg');
  const imgWhy = document.getElementById('imgWhy');
  if (artImg) imgObserver.observe(artImg, { attributes: true, attributeFilter: ['src', 'style'] });
  if (imgWhy) imgObserver.observe(imgWhy, { childList: true, subtree: true, characterData: true });
});

function toggleIncludeEntry(checked) {
  const block = document.getElementById('scYouWroteBlock');
  if (block) block.style.display = checked ? 'block' : 'none';
}

async function preloadShareImage() {
  const img = document.getElementById('scImg');
  if (!img.src || img.src.startsWith('data:')) return;
  try {
    const r = await fetch(img.src);
    if (!r.ok) return;
    const blob = await r.blob();
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
    return new Promise((resolve) => {
      const newImg = new Image();
      newImg.onload = () => { img.src = dataUrl; setTimeout(resolve, 200); };
      newImg.onerror = () => resolve();
      newImg.src = dataUrl;
    });
  } catch (e) {
    console.warn('Image preload failed:', e);
  }
}

// html2canvas 1.4.1 does not honour object-fit: it draws the artwork stretched
// to the element box, so the on-screen card is correct but the exported PNG is
// distorted. Compute the contain-fit in pixels and set it explicitly before
// capture — explicit dimensions are the one thing html2canvas respects.
function fitShareImageForExport() {
  const img = document.getElementById('scImg');
  const block = document.getElementById('scImageBlock');
  if (!img || !block || !img.naturalWidth || !img.naturalHeight) return;
  const availW = block.clientWidth;
  const availH = Math.round(img.getBoundingClientRect().height);
  if (!availW || !availH) return;
  const scale = Math.min(availW / img.naturalWidth, availH / img.naturalHeight);
  img.style.width  = Math.round(img.naturalWidth  * scale) + 'px';
  img.style.height = Math.round(img.naturalHeight * scale) + 'px';
  img.style.objectFit = 'fill';        // the box now matches the ratio exactly
  img.style.margin = '0 auto 14px';    // centre the letterboxed result
  img.dataset.exportFit = '1';
}

function resetShareImageFit() {
  const img = document.getElementById('scImg');
  if (!img || !img.dataset.exportFit) return;
  img.style.width = ''; img.style.height = '';
  img.style.objectFit = ''; img.style.margin = '';
  delete img.dataset.exportFit;
}

async function saveCard() {
  const toast = document.getElementById('toast');
  toast.textContent = 'Rendering...';
  toast.classList.add('visible');
  try {
    const container = document.getElementById('shareCardContainer');
    container.style.top = '0';
    container.style.left = '-10000px';
    await preloadShareImage();
    fitShareImageForExport();
    const card = document.getElementById('shareCard');
    const canvas = await html2canvas(card, {
      backgroundColor: null, scale: 2, useCORS: true, allowTaint: false, logging: false
    });
    resetShareImageFit();
    container.style.top = '-10000px';
    const link = document.createElement('a');
    link.download = 'dharmas-echo-' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    toast.textContent = 'Saved';
    setTimeout(() => toast.classList.remove('visible'), 2000);
  } catch (e) {
    console.error('Save failed:', e);
    toast.textContent = 'Save failed';
    setTimeout(() => toast.classList.remove('visible'), 2500);
  }
}

async function shareCard() {
  const toast = document.getElementById('toast');
  toast.textContent = 'Preparing...';
  toast.classList.add('visible');
  try {
    const container = document.getElementById('shareCardContainer');
    container.style.top = '0';
    container.style.left = '-10000px';
    await preloadShareImage();
    fitShareImageForExport();
    const card = document.getElementById('shareCard');
    const canvas = await html2canvas(card, {
      backgroundColor: null, scale: 2, useCORS: true, allowTaint: false, logging: false
    });
    resetShareImageFit();
    container.style.top = '-10000px';

    canvas.toBlob(async (blob) => {
      if (!blob) { throw new Error('Blob failed'); }
      const file = new File([blob], 'dharmas-echo.png', { type: 'image/png' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: "Dharma's Echo", text: 'From Dharma\u2019s Echo — dharmas-echo.vercel.app' });
          toast.textContent = 'Shared';
          setTimeout(() => toast.classList.remove('visible'), 2000);
          return;
        } catch (err) {
          if (err.name === 'AbortError') { toast.classList.remove('visible'); return; }
        }
      }
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        toast.textContent = 'Copied to clipboard';
        setTimeout(() => toast.classList.remove('visible'), 2500);
      } catch (err) {
        const link = document.createElement('a');
        link.download = 'dharmas-echo-' + Date.now() + '.png';
        link.href = URL.createObjectURL(blob);
        link.click();
        toast.textContent = 'Downloaded';
        setTimeout(() => toast.classList.remove('visible'), 2000);
      }
    }, 'image/png');
  } catch (e) {
    console.error('Share failed:', e);
    toast.textContent = 'Share failed';
    setTimeout(() => toast.classList.remove('visible'), 2500);
  }
}

function reset() {
  document.getElementById('entry').value = '';
  document.getElementById('response').classList.remove('visible');
  document.getElementById('againRow').classList.remove('visible');
  const saveRowReset = document.getElementById('saveRow');
  if (saveRowReset) saveRowReset.classList.remove('visible');
  // Reset include-entry toggle
  const toggleReset = document.getElementById('includeEntryToggle');
  if (toggleReset) toggleReset.checked = false;
  const youWroteBlockReset = document.getElementById('scYouWroteBlock');
  if (youWroteBlockReset) youWroteBlockReset.style.display = 'none';
  // Un-hide image block + dividers in case they were hidden last response
  const imgBlock = document.querySelector('.image-block');
  if (imgBlock) imgBlock.style.display = '';
  document.querySelectorAll('.divider').forEach(d => d.style.display = '');
  document.getElementById('echoBtn').disabled = false;
  document.querySelector('.write-area').style.display = '';
  document.querySelector('.echo-row').style.display = '';
  const hint = document.getElementById('writeHint');
  if (hint) hint.classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Hide hint when typing begins, restore when empty
document.addEventListener('DOMContentLoaded', function() {
  const entry = document.getElementById('entry');
  const hint = document.getElementById('writeHint');
  if (entry && hint) {
    entry.addEventListener('input', function() {
      if (entry.value.length > 0) {
        hint.classList.add('hidden');
      } else {
        hint.classList.remove('hidden');
      }
    });
  }
});
